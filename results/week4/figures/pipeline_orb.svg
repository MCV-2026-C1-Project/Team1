<svg xmlns="http://www.w3.org/2000/svg" width="680" height="600" viewBox="0 0 680 600" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>ORB v2 retrieval pipeline</title><desc>Query image, painting segmentation, CLAHE and resize to 384 px, ORB extraction, Hamming ratio test against museum features, RANSAC verification, ranking and unknown rejection.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="600" fill="#FFFFFF"/>
<rect x="60" y="20" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="210.0" y="38" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#444441">Query image</text><text x="210.0" y="58" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">May hold several paintings</text>
<line x1="210" y1="76" x2="210" y2="96" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60" y="98" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="210.0" y="116" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#444441">Segment paintings</text><text x="210.0" y="136" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">Wall model, threshold 4</text>
<line x1="210" y1="154" x2="210" y2="174" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60" y="176" width="300" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="210.0" y="194" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#712B13">CLAHE + resize</text><text x="210.0" y="214" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#993C1D">Longest side 384 px</text>
<line x1="210" y1="232" x2="210" y2="252" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60" y="254" width="300" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="210.0" y="272" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#712B13">ORB v2 (FAST + BRIEF)</text><text x="210.0" y="292" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#993C1D">Low threshold, 256 bits</text>
<line x1="210" y1="310" x2="210" y2="330" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60" y="332" width="300" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="210.0" y="350" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#712B13">Hamming ratio test</text><text x="210.0" y="370" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#993C1D">0.75, one-to-one</text>
<line x1="210" y1="388" x2="210" y2="408" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60" y="410" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="210.0" y="428" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#444441">RANSAC homography</text><text x="210.0" y="448" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">Tolerance 5, 8+ matches</text>
<line x1="210" y1="466" x2="210" y2="486" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60" y="488" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="210.0" y="506" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#444441">Ranking and rejection</text><text x="210.0" y="526" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">Top-K IDs or unknown (-1)</text>
<rect x="440" y="332" width="200" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1" stroke-dasharray="4 3"/><text x="540.0" y="350" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#712B13">Museum features</text><text x="540.0" y="370" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#993C1D">287 images, computed offline</text>
<line x1="438" y1="360" x2="362" y2="360" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60" y="566" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/><text x="82" y="574" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444441">Shared with the other methods</text><rect x="300" y="566" width="14" height="14" rx="3" fill="#FAECE7" stroke="#993C1D"/><text x="322" y="574" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444441">Specific to this method</text>
</svg>